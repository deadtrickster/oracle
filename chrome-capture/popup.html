<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    color: #1a1a1a; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #e6e6e6; } }
  header { padding: 10px 12px; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,.25); }
  .p { padding: 10px 12px; }
  button { width: 100%; padding: 8px; margin: 0 0 8px; border: 0; border-radius: 7px;
    font: inherit; font-weight: 600; cursor: pointer; }
  .primary { background: #2e7d32; color: #fff; }
  .ghost { background: rgba(128,128,128,.15); color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .8; margin: 4px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
  .ok { background: #2e7d32; } .bad { background: #c0392b; }
  label { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; cursor: pointer; }
  #msg { font-size: 12px; opacity: .8; min-height: 16px; }
</style>
</head>
<body>
  <header>Oracle Capture</header>
  <div class="p">
    <button id="capture" class="primary">Capture this page</button>
    <button id="drain" class="ghost">Retry queued (<span id="qn">0</span>)</button>
    <div class="row"><span id="d-recv" class="dot"></span> receiver</div>
    <div class="row"><span id="d-rag" class="dot"></span> RAGFlow (ingest)</div>
    <div class="row"><span id="d-syn" class="dot"></span> synth (explain)</div>
    <label><input type="checkbox" id="pdf" checked> attach PDF (shows a debug banner)</label>
    <div id="msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
